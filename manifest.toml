#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "vvveb"
name = "Vvveb"
description.en = "CMS to build websites, blogs or ecommerce stores"
description.fr = "CMS pour créer des sites Web, des blogs ou des boutiques de commerce électronique"

version = "1.0.8.4~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://www.vvveb.com/"
admindoc = "https://docs.vvveb.com/installation"
code = "https://github.com/givanz/Vvveb"
fund = "https://www.vvveb.com/page/sponsor"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    #[install.path]
    #type = "path"
    #default = "/vvveb"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
        in_subdir = false
        url = "https://github.com/givanz/Vvveb/releases/download/1.0.8.4/latest.zip"
        sha256 = "d0b48ae59de58a4a798c8905d6f1c2348e265edd04c06b0a20b5abc1fd4d513a"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset="latest\\.zip"

    [resources.system_user]

    [resources.install_dir]
        group = "www-data:r-x"

    [resources.permissions]
        main.url = "/"

    [resources.apt]
        packages = [
            "postgresql", 
            "php8.4-pgsql", 
            "php8.4-xml", 
            "php8.4-zip", 
            "php8.4-dom", 
            "php8.4-curl", 
            "php8.4-gettext", 
            "php8.4-gd",
            "php8.4-mbstring"
        ]

    [resources.database]
        type = "postgresql"
